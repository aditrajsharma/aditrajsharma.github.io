<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
  <title id="title">Aditraj Sharma — a builder's field notes</title>
  <desc id="desc">A warm editorial banner with a notebook label, a short personal motto, and an animated terminal window.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#C6CAE9" stroke-width="0.65" opacity="0.42" />
    </pattern>
    <clipPath id="round"><rect width="1120" height="330" rx="18" /></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1120" height="330" fill="#FAF3E7" />
    <rect width="1120" height="330" fill="url(#grid)" />
    <path d="M0 18Q0 0 18 0H1102Q1120 0 1120 18V48H0Z" fill="#0B0B4E" />
    <circle cx="26" cy="24" r="4" fill="#DB1E4B" />
    <circle cx="42" cy="24" r="4" fill="#ECC86B" />
    <circle cx="58" cy="24" r="4" fill="#9CA4D8" />
    <text x="80" y="29" font-family="monospace" font-size="12" fill="#FAF3E7" letter-spacing="2">PERSONAL FIELD NOTES / 001</text>
    <text x="1080" y="29" font-family="monospace" font-size="11" fill="#D1D3F0" text-anchor="end">STATUS: IN PROGRESS</text>

    <g transform="translate(58 82)">
      <rect x="0" y="0" width="104" height="25" rx="12.5" fill="#ECC86B" />
      <text x="52" y="17" fill="#0B0B4E" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">HELLO, WORLD</text>
      <text x="0" y="77" fill="#0B0B4E" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800" letter-spacing="-1.6">ADITRAJ SHARMA</text>
      <path d="M1 91H365" stroke="#DB1E4B" stroke-width="5" stroke-linecap="round">
        <animate attributeName="stroke-dasharray" values="0 365;365 0;365 0" keyTimes="0;0.6;1" dur="5s" repeatCount="indefinite" />
      </path>
      <text x="0" y="126" fill="#0B0B4E" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600">I build things to figure things out.</text>
      <text x="0" y="158" fill="#61699B" font-family="monospace" font-size="13">code / curiosity / a little visual chaos</text>
      <text x="0" y="205" fill="#61699B" font-family="monospace" font-size="11" letter-spacing="1.5">LEARN BY MAKING. IMPROVE BY ITERATING.</text>
    </g>

    <g transform="translate(680 74)">
      <rect x="0" y="0" width="382" height="214" rx="12" fill="#0B0B4E" />
      <path d="M0 38H382" stroke="#32326E" />
      <circle cx="19" cy="19" r="4" fill="#DB1E4B" />
      <circle cx="33" cy="19" r="4" fill="#ECC86B" />
      <circle cx="47" cy="19" r="4" fill="#81B8A4" />
      <text x="68" y="23" font-family="monospace" font-size="11" fill="#BFC4EA">tiny-experiments.js</text>
      <text x="22" y="68" font-family="monospace" font-size="12" fill="#747DB6">01</text>
      <text x="52" y="68" font-family="monospace" font-size="13" fill="#ECC86B">const</text>
      <text x="94" y="68" font-family="monospace" font-size="13" fill="#FAF3E7">curiosity = true;</text>
      <text x="22" y="95" font-family="monospace" font-size="12" fill="#747DB6">02</text>
      <text x="52" y="95" font-family="monospace" font-size="13" fill="#DBA7B5">while</text>
      <text x="98" y="95" font-family="monospace" font-size="13" fill="#FAF3E7">(stillLearning) {</text>
      <text x="22" y="122" font-family="monospace" font-size="12" fill="#747DB6">03</text>
      <text x="70" y="122" font-family="monospace" font-size="13" fill="#9CD6C0">buildSomething();</text>
      <text x="22" y="149" font-family="monospace" font-size="12" fill="#747DB6">04</text>
      <text x="70" y="149" font-family="monospace" font-size="13" fill="#9CD6C0">breakThings();</text>
      <text x="22" y="176" font-family="monospace" font-size="12" fill="#747DB6">05</text>
      <text x="70" y="176" font-family="monospace" font-size="13" fill="#9CD6C0">learn();</text>
      <rect x="137" y="165" width="8" height="16" rx="1" fill="#DB1E4B">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.38;0.39;0.85;1" dur="1.15s" repeatCount="indefinite" />
      </rect>
      <text x="22" y="202" font-family="monospace" font-size="10" fill="#747DB6">// repeat with better questions</text>
    </g>
    <path d="M642 81l7 14 14 7-14 7-7 14-7-14-14-7 14-7z" fill="#DB1E4B">
      <animateTransform attributeName="transform" type="rotate" from="0 642 102" to="360 642 102" dur="24s" repeatCount="indefinite" />
    </path>
    <circle cx="1072" cy="286" r="4" fill="#DB1E4B" />
    <circle cx="1087" cy="286" r="4" fill="#ECC86B" />
    <circle cx="1102" cy="286" r="4" fill="#0B0B4E" />
    <text x="58" y="306" fill="#61699B" font-family="monospace" font-size="10" letter-spacing="1.5">A WORK IN PROGRESS, BY DESIGN.</text>
  </g>
</svg>
