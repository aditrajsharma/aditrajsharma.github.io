<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditraj Sharma — Gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%230B0B4E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF3E7;
    --bg2: #FCFCF9;
    --ink: #0B0B4E;
    --muted: #61699B;
    --line: #C6CAE9;
    --line-dark: #101090;
    --accent: #DB1E4B;
    --hl: #ECC86B;
    --mono: 'Space Mono', ui-monospace, 'Courier New', monospace;
    --sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: var(--hl); color: var(--ink); }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; width: 100%; }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }

  /* ---------- floating pill navbar ---------- */
  .nav-wrapper {
    position: sticky;
    top: 18px;
    z-index: 100;
    display: flex;
    justify-content: center;
    padding: 10px 24px 20px;
  }
  .nav-pill {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 6px 10px;
    background: rgba(250, 243, 231, 0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(11, 11, 78, 0.08);
  }
  .nav-pill a {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 999px;
    transition: color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .nav-pill a:hover {
    color: var(--ink);
  }
  .nav-pill a.active {
    background: var(--accent);
    color: #FFFFFF;
    font-weight: 700;
  }

  /* ---------- main layout ---------- */
  main {
    flex: 1;
    padding: 24px 0 72px;
  }
  .page-intro {
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
  }
  .eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .eyebrow .sq {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--accent);
    margin-right: 8px;
    transform: translateY(-1px);
  }
  h1 {
    font-size: clamp(32px, 4.5vw, 54px);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1.08;
  }
  .filter-pill {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid var(--line-dark);
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--bg2);
    color: var(--muted);
  }

  /* ---------- pixel gallery frame container ---------- */
  .pixel-box {
    border: 2px solid var(--accent);
    border-radius: 16px;
    background: var(--bg2);
    overflow: hidden;
    box-shadow: 0 12px 36px rgba(219, 30, 75, 0.08);
  }
  .pixel-header {
    background: var(--accent);
    color: #FFFFFF;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .pixel-header .dots {
    display: flex;
    gap: 6px;
  }
  .pixel-header .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #FFFFFF;
    opacity: 0.85;
  }

  /* ---------- gallery grid ---------- */
  .pixel-body {
    padding: 20px;
  }
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .gallery-item {
    border: 1.5px solid var(--line-dark);
    border-radius: 12px;
    background: var(--bg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .gallery-item:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(11, 11, 78, 0.08);
  }
  .gallery-item.featured {
    grid-column: span 2;
  }
  .img-frame {
    width: 100%;
    aspect-ratio: 4/3;
    overflow: hidden;
    background: #E5E8F5;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gallery-item.featured .img-frame {
    aspect-ratio: 16/10;
  }
  .img-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .gallery-item:hover .img-frame img {
    transform: scale(1.03);
  }
  .placeholder-box {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #E2E6F5;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 20px;
    text-align: center;
  }
  .placeholder-box svg {
    opacity: 0.6;
  }
  .item-cap {
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-top: 1px solid var(--line);
    background: var(--bg2);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .item-cap .tag {
    color: var(--accent);
    font-weight: 700;
  }

  /* ---------- footer ---------- */
  footer {
    border-top: 1px solid var(--ink);
    padding: 40px 0 28px;
    margin-top: auto;
  }
  .foot-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .foot-row a {
    color: var(--ink);
    border-bottom: 1px solid var(--ink);
    padding-bottom: 1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .foot-row a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ---------- responsive ---------- */
  @media (max-width: 960px) {
    .gallery-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .gallery-item.featured {
      grid-column: span 2;
    }
    .nav-pill {
      gap: 6px;
      padding: 4px 6px;
    }
    .nav-pill a {
      padding: 6px 12px;
      font-size: 10px;
    }
  }
  @media (max-width: 640px) {
    .gallery-grid {
      grid-template-columns: 1fr;
    }
    .gallery-item.featured {
      grid-column: span 1;
    }
    .gallery-item.featured .img-frame {
      aspect-ratio: 4/3;
    }
    .nav-wrapper {
      padding: 8px 12px 14px;
    }
    .nav-pill {
      width: 100%;
      justify-content: space-between;
      overflow-x: auto;
    }
    .nav-pill a {
      padding: 5px 10px;
      font-size: 9px;
    }
  }
</style>
</head>
<body>

<!-- ============ FLOATING PILL NAVBAR ============ -->
<div class="nav-wrapper">
  <nav class="nav-pill" aria-label="Main Navigation">
    <a href="index.html#home">Home</a>
    <a href="index.html#project">Projects</a>
    <a href="index.html#experience">Experience</a>
    <a href="index.html#life">Life</a>
    <a href="gallery.html" class="active">Gallery</a>
  </nav>
</div>

<!-- ============ MAIN GALLERY PAGE ============ -->
<main>
  <div class="wrap">
    <div class="page-intro">
      <div>
        <div class="eyebrow"><span class="sq"></span>Visual Archives &amp; Sketches</div>
        <h1>Pixel Gallery</h1>
      </div>
      <div class="filter-pill">Selected Moments • 2026</div>
    </div>

    <!-- ============ PIXEL GALLERY CONTAINER ============ -->
    <div class="pixel-box">
      <div class="pixel-header">
        <span>Pixel Gallery</span>
        <div class="dots">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
      <div class="pixel-body">
        <div id="gallery-container" class="gallery-grid">
          <!-- Rendered dynamically from galleryImages array -->
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ============ FOOTER ============ -->
<footer>
  <div class="wrap foot-row">
    <span>© 2026 Aditraj Sharma — Gallery</span>
    <a href="index.html">← Back to Homepage</a>
  </div>
</footer>

<script>
  // =======================================================
  // GALLERY DATA
  // =======================================================
  // TODO: add my images to /gallery and update this array
  const galleryImages = [
    {
      src: "",
      alt: "Artwork 01",
      caption: "Digital Vector Art",
      tag: "Illustration",
      featured: true
    },
    {
      src: "",
      alt: "Artwork 02",
      caption: "Manga Ink Sketch",
      tag: "Sketch",
      featured: false
    },
    {
      src: "",
      alt: "Artwork 03",
      caption: "Visual Poster Study",
      tag: "Editorial",
      featured: false
    },
    {
      src: "",
      alt: "Artwork 04",
      caption: "Generative Shader Capture",
      tag: "3D / WebGL",
      featured: false
    },
    {
      src: "",
      alt: "Artwork 05",
      caption: "Typography Exploration",
      tag: "Design",
      featured: false
    },
    {
      src: "",
      alt: "Artwork 06",
      caption: "Field Camera Note",
      tag: "Photography",
      featured: false
    }
  ];

  // =======================================================
  // RENDER GALLERY
  // =======================================================
  function renderGallery() {
    const container = document.getElementById('gallery-container');
    if (!container) return;

    container.innerHTML = galleryImages.map((item, idx) => {
      const hasSrc = item.src && item.src.trim() !== "";
      const mediaHtml = hasSrc
        ? `<img src="${item.src}" alt="${item.alt || ''}">`
        : `
          <div class="placeholder-box">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="3"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path d="m21 15-5-5L5 21"/>
            </svg>
            <span>Artwork Tile ${idx + 1}</span>
          </div>
        `;

      const featuredClass = item.featured ? ' featured' : '';

      return `
        <article class="gallery-item${featuredClass}">
          <div class="img-frame">
            ${mediaHtml}
          </div>
          <div class="item-cap">
            <span>${item.caption || 'Visual Piece'}</span>
            <span class="tag">${item.tag || 'Art'}</span>
          </div>
        </article>
      `;
    }).join('');
  }

  renderGallery();
</script>
</body>
</html>
